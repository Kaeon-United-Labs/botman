<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>botman</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="chat">
    <header>botman <span id="status" class="status"></span></header>
    <div id="messages" class="messages" aria-live="polite"></div>
    <div id="typing" class="typing" hidden>botman is thinking…</div>
    <form id="form" class="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Message botman" maxlength="2000"></textarea>
      <button type="submit">Send</button>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
